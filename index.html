<!doctype html>
<html><head><meta charset="utf-8">
<title>LinkedIn carousel</title>
<style>
@font-face{font-family:Inter;src:url("assets/fonts/inter-latin-400-normal.woff2");font-weight:400}
@font-face{font-family:Inter;src:url("assets/fonts/inter-latin-600-normal.woff2");font-weight:600}
@font-face{font-family:Inter;src:url("assets/fonts/inter-latin-700-normal.woff2");font-weight:700}
@font-face{font-family:Inter;src:url("assets/fonts/inter-latin-800-normal.woff2");font-weight:800}
:root{--bg:#E8F2FE;--ink:#00204E;--accent:#0068E5;--soft:#7DB4FF;--muted:#5B6B85;--line:#D6E6FF;--red:#D9382C;--green:#1F9D55}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;background:#111;font-family:Inter,sans-serif;color:var(--ink)}
@page{size:1080px 1350px;margin:0}
@media print{body{background:none}.s{break-after:page}}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
.s.dark{background:var(--ink);color:#fff}
.s>svg.bg{position:absolute;inset:0}
.in{position:absolute;inset:0;padding:60px 72px 52px;display:flex;flex-direction:column}

/* top bar: progress + tag */
.top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:none}
.prog{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 22px;font:700 24px/1 Inter;color:var(--muted)}
.prog .tr{width:150px;height:10px;border-radius:9px;background:var(--bg);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--accent);border-radius:9px}
.prog b{color:var(--ink)}
.dark .prog{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#c9d6ea}
.dark .prog b{color:#fff}
.dark .prog .tr{background:rgba(255,255,255,.14)}
.tag{font:700 24px/1 Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dark .tag{color:var(--soft)}

/* footer */
.foot{display:flex;align-items:center;justify-content:space-between;flex:none;height:64px;margin-top:auto}
.who{display:flex;align-items:center;gap:16px;font:700 28px/1 Inter;letter-spacing:-.01em}
.who small{font:600 24px/1 Inter;color:var(--muted)}
.dark .who small{color:#c9d6ea}
.pic{flex:none;width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12);background:var(--accent);color:#fff;display:grid;place-items:center;font:800 22px/1 Inter;letter-spacing:.02em}
.swipe{display:flex;align-items:center;gap:12px;font:700 28px/1 Inter;color:#fff;background:var(--ink);padding:16px 24px 16px 28px;border-radius:999px}
.dark .swipe{background:var(--accent)}
.swipe svg{width:28px;height:28px}

h2{font:800 78px/1.04 Inter;letter-spacing:-.04em;margin-top:34px;flex:none;text-wrap:balance}
h2 span,h1 span{color:var(--accent)}
.dark h2 span{color:var(--soft)}
.num{display:flex;align-items:center;gap:16px;margin-top:34px;flex:none}
.num b{height:56px;padding:0 22px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 28px/1 Inter;letter-spacing:.04em}
.num span{font:700 28px/1 Inter;color:var(--muted)}
.num + h2{margin-top:18px}

/* white illustration card */
.viz{flex:1;min-height:0;margin-top:30px;background:#fff;border:1px solid var(--line);border-radius:36px;box-shadow:0 10px 30px rgba(0,0,0,.06);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:40px 44px;gap:22px}
.tip{flex:none;margin:26px 0 28px;display:flex;gap:22px;align-items:center;background:var(--ink);color:#fff;border-radius:26px;padding:26px 30px}
.tip .t{flex:none;background:var(--accent);border-radius:12px;padding:14px 18px;font:800 22px/1 Inter;letter-spacing:.07em}
.tip p{font:700 33px/1.22 Inter;letter-spacing:-.015em;text-wrap:balance}

/* chat */
.ask{align-self:flex-end;max-width:82%;background:var(--accent);color:#fff;border-radius:30px 30px 8px 30px;padding:26px 32px;font:700 38px/1.2 Inter;letter-spacing:-.015em}
.ans{display:flex;gap:20px;align-items:flex-start}
.bot{flex:none;width:70px;height:70px;border-radius:18px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.bot svg{width:38px;height:38px}
.bub{flex:1;background:var(--bg);border-radius:8px 30px 30px 30px;padding:22px 26px}
.bub .lead{font:700 34px/1.2 Inter;letter-spacing:-.015em}
.bub .lead span{color:var(--accent)}
.rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.r{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:17px 18px;font:600 30px/1 Inter;color:#33476b}
.r .u{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .c{flex:none;font-weight:800;color:var(--ink)}
.pill{flex:none;font:800 24px/1 Inter;padding:9px 13px;border-radius:9px;letter-spacing:.03em}
.pill.red{background:#FDE8E6;color:var(--red)}
.pill.green{background:#E3F5EA;color:var(--green)}
.pill.blue{background:#E1EEFE;color:var(--accent)}

/* cover */
.cov .in{padding:60px 72px 52px}
.chip{display:inline-flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:14px 28px;font:700 27px/1 Inter;box-shadow:0 4px 14px rgba(0,0,0,.05);align-self:flex-start}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
h1{font:800 112px/.98 Inter;letter-spacing:-.05em;margin-top:44px}
.sub{font:600 40px/1.25 Inter;letter-spacing:-.02em;color:var(--muted);margin-top:34px;max-width:820px}
.card{margin-top:44px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:30px 34px;box-shadow:0 14px 40px rgba(0,0,0,.08);width:600px}
.card .t{font:800 30px/1.1 Inter;letter-spacing:-.02em}
.card ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:14px}
.card li{font:600 31px/1.2 Inter;color:#33476b;display:flex;gap:14px;align-items:center}
.card li:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.card .lk{margin-top:24px;background:var(--accent);color:#fff;font:700 30px/1 Inter;padding:22px 0;border-radius:999px;text-align:center}

/* statement (dark) */
.vsw{margin-top:60px;display:flex;flex-direction:column;gap:28px;flex:none}
.old{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:34px 36px}
.old .h,.new .h{font:800 28px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:#c9d6ea}
.steps{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.steps i{font-style:normal;font:700 34px/1 Inter;background:rgba(255,255,255,.1);border-radius:12px;padding:16px 18px;color:#dbe7f8;text-decoration:line-through;text-decoration-color:rgba(255,120,110,.8);text-decoration-thickness:3px}
.steps em{font-style:normal;color:var(--soft);font:700 32px/1 Inter}
.new{background:#fff;color:var(--ink);border-radius:28px;padding:34px 36px}
.new .h{color:var(--accent)}
.new .q{margin-top:16px;font:800 56px/1.12 Inter;letter-spacing:-.03em}
.punch{margin-top:auto;margin-bottom:34px;font:800 56px/1.1 Inter;letter-spacing:-.035em}
.punch span{color:var(--soft)}
.punch + .foot{margin-top:0}

/* steps */
.flow{display:flex;flex-direction:column}
.fs{display:flex;gap:26px;align-items:center}
.fs .ic{flex:none;width:112px;height:112px;border-radius:28px;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);font:800 48px/1 Inter;color:var(--accent)}
.fs .tx b{display:block;font:800 40px/1.1 Inter;letter-spacing:-.025em}
.fs .tx span{display:block;margin-top:8px;font:600 28px/1.25 Inter;color:var(--muted)}
.fl{width:4px;height:44px;margin-left:54px;background:repeating-linear-gradient(var(--accent) 0 8px,transparent 8px 16px)}

/* bars */
.lab{font:800 26px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lane{display:flex;align-items:center;gap:18px}
.lane .bar{flex:1;height:84px;border-radius:18px;background:var(--bg);position:relative;overflow:hidden}
.lane .bar i{position:absolute;inset:0 auto 0 0;border-radius:18px}
.lane .k{flex:none;width:270px;font:800 36px/1.1 Inter;letter-spacing:-.02em}
.lane .res{flex:none;width:280px;font:700 30px/1.2 Inter}
.res.bad{color:var(--red)}.res.good{color:var(--green)}

/* compare */
.two{display:flex;gap:26px;align-items:stretch}
.two>div{flex:1;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
.two .good{background:#E1EEFE;border:2px solid var(--accent)}
.two .bad{background:var(--bg);border:2px solid var(--line);position:relative;overflow:hidden}
.two .bad:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,var(--bg))}
.two .h{font:800 30px/1 Inter;letter-spacing:.04em;text-transform:uppercase}
.two .good .h{color:var(--accent)}.two .bad .h{color:var(--muted)}
.big{font:800 150px/1 Inter;letter-spacing:-.04em;color:var(--ink)}
.minr{height:30px;border-radius:6px;background:#fff}

/* list (dark) */
.list{margin-top:36px;display:flex;flex-direction:column;gap:16px;flex:none}
.li{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px 26px}
.li b{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.li b svg{width:26px;height:26px}
.li span{font:700 33px/1.2 Inter;letter-spacing:-.02em}

/* cta */
.fol{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:28px 32px;box-shadow:0 14px 40px rgba(0,0,0,.08);display:flex;align-items:center;gap:24px}
.fol .pic{width:96px;height:96px;font-size:34px}
.fol .tx{flex:1}
.fol .nm{font:800 36px/1.05 Inter;letter-spacing:-.03em}
.fol .ds{font:600 26px/1.25 Inter;color:var(--muted);margin-top:8px}
.fol .bt{flex:none;background:var(--ink);color:#fff;font:700 26px/1 Inter;padding:20px 26px;border-radius:999px}
</style></head>
<body>
<script src="slides.js"></script>
<script>
const { brand, slides } = window.CAROUSEL;
const N = slides.length;
const root = document.documentElement.style;
Object.entries(brand.colors || {}).forEach(([k, v]) => root.setProperty("--" + k, v));

const hl = (t = "") => String(t).replace(/\*(.+?)\*/g, "<span>$1</span>");
const initials = (brand.name || "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
const pic = (cls = "pic") => brand.photo ? `<img class="${cls}" src="${brand.photo}" alt="">` : `<span class="${cls}">${initials}</span>`;
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const tick = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const spark = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>';

// faint node-link tree in the background, four placements
const tree = (x, y, s, flip, op) => {
  const f = flip ? -1 : 1, P = (a, b) => [x + a * s * f, y + b * s];
  const nodes = [[0,0],[1,-.9],[1,0],[1,.9],[2,-1.35],[2,-.45],[2,.45],[2,1.35],[3,-1.6],[3,-1.1],[3,.2],[3,.7],[3,1.6]];
  const edges = [[0,1],[0,2],[0,3],[1,4],[1,5],[2,6],[3,7],[4,8],[4,9],[6,10],[6,11],[7,12]];
  let g = `<g stroke="currentColor" stroke-width="5" fill="none" opacity="${op}">`;
  edges.forEach(([a, b]) => { const [x1, y1] = P(...nodes[a]), [x2, y2] = P(...nodes[b]), mx = (x1 + x2) / 2; g += `<path d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`; });
  g += `</g><g fill="currentColor" opacity="${op * 1.3}">`;
  nodes.forEach((n, i) => { const [cx, cy] = P(...n); g += i === 0 ? `<rect x="${cx - 26}" y="${cy - 26}" width="52" height="52" rx="12"/>` : `<circle cx="${cx}" cy="${cy}" r="${i < 4 ? 17 : 12}"/>`; });
  return g + "</g>";
};
const bg = (i, dark) => {
  const o = dark ? .14 : .1;
  const v = [tree(700, 1180, 150, false, o), tree(380, 170, 150, true, o), tree(-60, 1150, 150, false, o), tree(1120, 1140, 150, true, o)][i % 4];
  const glow = dark ? "" : `<defs><radialGradient id="g${i}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="540" cy="460" rx="620" ry="400" fill="url(#g${i})"/>`;
  return `<svg class="bg" width="1080" height="1350" viewBox="0 0 1080 1350" style="color:var(${dark ? "--soft" : "--accent"})">${v}${glow}</svg>`;
};
const topBar = (k, tag) => `<div class="top"><div class="prog"><b>${k} / ${N}</b><span class="tr"><i style="width:${Math.round(k / N * 100)}%"></i></span></div><span class="tag">${tag || ""}</span></div>`;
const foot = (last) => `<div class="foot"><div class="who">${pic()}<div>${brand.name}${brand.handle ? `<br><small>${brand.handle}</small>` : ""}</div></div>${last ? "" : `<div class="swipe">Swipe ${arrow}</div>`}</div>`;
const tipBox = (t) => t ? `<div class="tip"><span class="t">${t.label || "TIP"}</span><p>${hl(t.text)}</p></div>` : "";
const num = (s) => s.label ? `<div class="num"><b>${s.label}</b>${s.of ? `<span>${s.of}</span>` : ""}</div>` : "";
const section = (i, s, dark, inner) => `<section class="s${dark ? " dark" : ""}${s.type === "cover" ? " cov" : ""}">${bg(i, dark)}<div class="in">${inner}</div></section>`;

const render = {
  cover: (s, i) => section(i, s, false, `
    ${s.chip ? `<div class="chip"><i></i>${s.chip}</div>` : ""}
    <h1>${hl(s.title)}</h1>
    ${s.sub ? `<p class="sub">${hl(s.sub)}</p>` : ""}
    ${s.card ? `<div class="card"><div class="t">${s.card.title}</div><ul>${s.card.items.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${foot()}`),
  statement: (s, i) => section(i, s, true, `${topBar(i + 1, s.tag)}
    <h2>${hl(s.title)}</h2>
    <div class="vsw">
      <div class="old"><div class="h">${s.beforeLabel || "Before"}</div><div class="steps">${s.before.map((x) => `<i>${x}</i>`).join("<em>→</em>")}</div></div>
      <div class="new"><div class="h">${s.afterLabel || "Now"}</div><div class="q">${hl(s.after)}</div></div>
    </div>
    ${s.punch ? `<div class="punch">${hl(s.punch)}</div>` : ""}
    ${foot()}`),
  steps: (s, i) => section(i, s, false, `${topBar(i + 1, s.tag)}
    <h2>${hl(s.title)}</h2>
    <div class="viz"><div class="flow">${s.steps.map((st, k) => `<div class="fs"><span class="ic">${k + 1}</span><div class="tx"><b>${st.title}</b><span>${st.text}</span></div></div>`).join('<div class="fl"></div>')}</div></div>
    ${tipBox(s.tip)}${foot()}`),
  chat: (s, i) => section(i, s, false, `${topBar(i + 1, s.tag)}
    <h2>${hl(s.title)}</h2>
    <div class="viz">
      <div class="ask">${s.ask}</div>
      <div class="ans"><span class="bot">${spark}</span><div class="bub"><div class="lead">${hl(s.lead)}</div><div class="rows">
        ${s.rows.map((r) => `<div class="r"><span class="u">${r.text}</span>${r.value ? `<span class="c">${r.value}</span>` : ""}${r.pill ? `<span class="pill ${r.pill.color || "blue"}">${r.pill.text}</span>` : ""}</div>`).join("")}
      </div></div></div>
    </div>
    ${tipBox(s.tip)}${foot()}`),
  bars: (s, i) => section(i, s, false, `${topBar(i + 1, s.tag)}${num(s)}
    <h2>${hl(s.title)}</h2>
    <div class="viz" style="gap:34px">
      ${s.caption ? `<div class="lab">${s.caption}</div>` : ""}
      ${s.bars.map((b) => `<div class="lane"><span class="k">${b.name}</span><span class="bar"><i style="width:${b.pct}%;background:${b.good ? "var(--accent)" : "#F3B7B0"}"></i></span><span class="res ${b.good ? "good" : "bad"}">${b.result}</span></div>`).join("")}
    </div>
    ${tipBox(s.tip)}${foot()}`),
  compare: (s, i) => section(i, s, false, `${topBar(i + 1, s.tag)}${num(s)}
    <h2>${hl(s.title)}</h2>
    <div class="viz"><div class="two">
      <div class="good"><span class="h">${s.left.label}</span><span class="big">${s.left.value}</span><span style="font:700 26px/1.2 Inter;color:#33476b">${s.left.note || ""}</span></div>
      <div class="bad"><span class="h">${s.right.label}</span>${Array.from({ length: 9 }, () => '<div class="minr"></div>').join("")}</div>
    </div></div>
    ${tipBox(s.tip)}${foot()}`),
  list: (s, i) => section(i, s, true, `${topBar(i + 1, s.tag)}
    <h2>${hl(s.title)}</h2>
    <div class="list">${s.items.map((x) => `<div class="li"><b>${tick}</b><span>${hl(x)}</span></div>`).join("")}</div>
    ${foot()}`),
  cta: (s, i) => section(i, s, false, `${topBar(i + 1, s.tag)}
    <h2>${hl(s.title)}</h2>
    ${s.card ? `<div class="card"><div class="t">${s.card.title}</div><ul>${s.card.items.map((x) => `<li>${x}</li>`).join("")}</ul>${s.card.button ? `<div class="lk">${s.card.button}</div>` : ""}</div>` : ""}
    ${s.follow ? `<div class="fol">${pic()}<div class="tx"><div class="nm">${brand.name}</div><div class="ds">${s.follow.line || ""}</div></div><div class="bt">${s.follow.button || "Follow"}</div></div>` : ""}
    ${foot(true)}`),
};

document.body.innerHTML = slides.map((s, i) => {
  const fn = render[s.type];
  if (!fn) throw new Error("Unknown slide type: " + s.type);
  return fn(s, i);
}).join("");
</script>
</body></html>
